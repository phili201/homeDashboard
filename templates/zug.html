{% extends "base.html" %}
{% block title %}Züge{% endblock %}

{% block content %}
<h1>Zugübersicht</h1>

<div class="grid">
    {% for t in trains %}
    <div class="card">
        <h3>{{ t.line }}</h3>
        <p>{{ t.time }}</p>
        <p style="color: {{ t.color }};">Verspätung: {{ t.delay }}</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
