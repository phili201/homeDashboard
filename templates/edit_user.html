{% extends "base.html" %}
{% block content %}

<div class="admin-container card">
    <h2>Nutzer bearbeiten: {{ user.name }}</h2>

    <form method="POST" class="admin-form">
        <input type="text" name="name" value="{{ user.name }}" required>
        <input type="text" name="calendar_id" value="{{ user.calendar_id }}">
        <input type="email" name="email" value="{{ user.email }}">
        <select name="role">
            <option value="user" {% if user.role == "user" %}selected{% endif %}>Nutzer</option>
            <option value="admin" {% if user.role == "admin" %}selected{% endif %}>Admin</option>
        </select>
        <button type="submit">Speichern</button>
    </form>

    <a class="back" href="/admin">Zurück</a>
</div>

{% endblock %}
