{% extends "base.html" %}
{% block title %}Rezept{% endblock %}

{% block content %}
<h1>{{ recipe.title }}</h1>

<div class="card">
    <h3>Zutaten</h3>
    <ul>
        {% for ing in recipe.ingredients %}
        <li>{{ ing }}</li>
        {% endfor %}
    </ul>

    <a href="/einkaufsliste/add_from_api/{{ rid }}">
        <button>Zur Einkaufsliste hinzufügen</button>
    </a>
</div>
{% endblock %}
