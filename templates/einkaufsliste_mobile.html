{% extends "base.html" %}
{% block title %}Einkaufsliste{% endblock %}

{% block content %}
<h1>Einkaufsliste</h1>

<div class="grid">
    {% for item in items %}
    <div class="card">
        <h3>{{ item.name }}</h3>
        <p>Status: {{ item.status }}</p>

        <form method="POST" action="/api/shopping/toggle">
            <input type="hidden" name="index" value="{{ loop.index0 }}">
            <button>Toggle</button>
        </form>

        <form method="POST" action="/api/shopping/delete">
            <input type="hidden" name="index" value="{{ loop.index0 }}">
            <button style="background:#ef4444;">Löschen</button>
        </form>
    </div>
    {% endfor %}
</div>
{% endblock %}
