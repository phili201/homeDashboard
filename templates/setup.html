{% extends "base.html" %}
{% block title %}Setup – Module auswählen{% endblock %}

{% block content %}
<h1>Module auswählen</h1>

<div class="card" style="max-width: 450px; margin: auto;">
    <form method="POST">

        <label><input type="checkbox" name="calendar"> Kalender</label><br>
        <label><input type="checkbox" name="recipes"> Rezepte</label><br>
        <label><input type="checkbox" name="pv"> PV‑Anlage</label><br>
        <label><input type="checkbox" name="alexa"> Alexa</label><br>
        <label><input type="checkbox" name="abfall"> Abfallkalender</label><br>
        <label><input type="checkbox" name="weather"> Wetter</label><br>

        <button type="submit">Speichern</button>
    </form>
</div>
{% endblock %}
