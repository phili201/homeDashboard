{% extends "base.html" %}
{% block title %}Abfallkalender{% endblock %}

{% block content %}
<h1>Abfallkalender – Woche</h1>

<div class="grid">
    {% for event in events %}
    <div class="card">
        <h3>{{ event.weekday }}</h3>
        <p>{{ event.icon }} {{ event.name }}</p>
        <p>{{ event.begin }}</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
