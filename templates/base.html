<!DOCTYPE html>
<html lang="de">
<head>

    <title>{% block title %}HomeDashboard{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
</head>
<body>
    <div class="page">

        <header class="topbar">
            <div class="logo">HomeDashboard</div>
            <nav>
                <a href="/dashboard">Dashboard</a>
                <a href="/admin">Admin</a>
                <a href="/logout">Logout</a>
            </nav>
        </header>

        <main class="content">
            {% block content %}{% endblock %}
        </main>

    </div>
</body>
</html>
