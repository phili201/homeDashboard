{% extends "base.html" %}
{% block content %}

<div class="centered">
    <div class="card">
        <h2>Dashboard Login</h2>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <input type="password" name="pin" placeholder="PIN eingeben">
            <button type="submit">Login</button>
        </form>
    </div>
</div>

{% endblock %}
