{% extends "base.html" %}
{% block content %}

<div class="card">
    <h2>Ergebnisse</h2>

    <div class="recipe-list">
        {% for r in results %}
        <a class="recipe-item" href="/rezepte/view_api/{{ r.id }}">
            <img src="{{ r.image }}" class="recipe-img">
            <h3>{{ r.title }}</h3>
            <p>{{ r.readyInMinutes }} min • {{ r.servings }} Portionen</p>
        </a>
        {% endfor %}
    </div>
</div>

{% endblock %}
